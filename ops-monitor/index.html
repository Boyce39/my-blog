<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self' blob:; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'"><title>BoyceLab｜線上營運監控</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#19303b;font:15px/1.7 system-ui,-apple-system,'Microsoft JhengHei',sans-serif}header{height:48px;background:#102a33;color:white;padding:8px 18px;display:flex;align-items:center;gap:14px;font-size:12px}header strong{white-space:nowrap}#state{flex:1;color:#bfd9dc;font-size:11px}button{cursor:pointer;background:#087b78;color:white;border:0;border-radius:7px;padding:8px 12px;font:inherit}header button{padding:3px 10px;font-size:11px}#gate{max-width:560px;margin:12vh auto;padding:30px;background:white;border:1px solid #dce5e8;border-radius:14px}h1{font-size:25px;margin:0 0 14px}p{color:#596e79;font-size:14px}input{width:100%;padding:12px;border:1px solid #bcced4;border-radius:7px;margin:10px 0;font:inherit}#error{color:#a43838;font-size:13px;min-height:22px}iframe{display:none;width:100%;height:calc(100vh - 48px);border:0}small{font-size:11px;color:#6b7e89}.row{display:flex;gap:10px;align-items:center}@media(max-width:650px){#gate{margin:8vh 16px;padding:23px}header{gap:8px;padding:8px}#state{line-height:1.3}}</style></head><body>
<header><strong>BoyceLab｜線上監控</strong><span id="state">尚未解鎖 · 不公開內部營運資料</span><button id="reload" hidden>更新</button><button id="lock" hidden>鎖定</button></header>
<section id="gate"><h1>你的 AI 公司，狀態看得見。</h1><p>請使用交付給你的私密入口，或輸入閱讀金鑰。此網址的頁面與密文可公開存取，但沒有金鑰不能解讀營運資料。</p><label for="key">私人閱讀金鑰</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="僅在此瀏覽器解鎖，不送往伺服器"><div class="row"><button id="unlock">解鎖監控台</button><small>不需要登入 Google 或重新設定 Codex。</small></div><div id="error" role="alert"></div><p><small>每60秒檢查已發佈資料。沒有新工作回執就顯示待命或過期；這個網站不會自行啟動智能體。請勿分享私密連結或金鑰。</small></p></section>
<iframe id="dashboard" title="BoyceLab 私人營運狀態" sandbox="allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
<script>
'use strict';
const RECIPIENT={kty:'EC',crv:'P-256',x:'Hy_aGGzy95IoKylTLlpd0e1i0ELXjWNgsO-WLhm82hg',y:'0ioKwxrdIbjHiIwZHFb4pu56ql1oBoBfPOhVEs4IONk',kid:'69d0147562809bf7'};
const $=id=>document.getElementById(id),frame=$('dashboard'),info=new TextEncoder().encode('BoyceLab-monitor-v1'),store='boycelab-monitor:'+RECIPIENT.kid;
let priv=null,lastCipher='',busy=false,view='overview',failures=0;
function b64(s,max=1500000){if(typeof s!=='string'||s.length>max||!/^[A-Za-z0-9_-]+$/.test(s))throw Error('encoding');return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0))}
async function decode(e){if(e.v!==1||e.alg!=='ECDH-P256-HKDF-SHA256-A256GCM'||e.kid!==RECIPIENT.kid||e.epk?.crv!=='P-256'||e.epk?.kty!=='EC'||e.epk?.d)throw Error('format');const salt=b64(e.salt,44),iv=b64(e.iv,17);if(salt.length!==32||iv.length!==12)throw Error('size');const ep=await crypto.subtle.importKey('jwk',e.epk,{name:'ECDH',namedCurve:'P-256'},false,[]);const shared=await crypto.subtle.deriveBits({name:'ECDH',public:ep},priv,256);const material=await crypto.subtle.importKey('raw',shared,'HKDF',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info},material,{name:'AES-GCM',length:256},false,['decrypt']);const zipped=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:info,tagLength:128},key,b64(e.data));const stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));const reader=stream.getReader(),parts=[];let size=0;while(true){const {done,value}=await reader.read();if(done)break;size+=value.length;if(size>1000000){await reader.cancel();throw Error('too large')}parts.push(value)}const html=await new Blob(parts).text();if(!html.startsWith('<!doctype html>'))throw Error('content');return html}
async function refresh(){if(!priv||busy)return;busy=true;const ctl=new AbortController(),deadline=setTimeout(()=>ctl.abort(),12000);try{const u=new URL('payload.json',location.href);u.searchParams.set('v',Math.floor(Date.now()/60000));const r=await fetch(u,{cache:'no-store',credentials:'omit',redirect:'error',signal:ctl.signal});if(!r.ok)throw Error('HTTP');const raw=await r.text();if(raw.length>1500000)throw Error('size');const e=JSON.parse(raw);if(!/^[a-f0-9]{12}$/.test(e.rev)||!Array.isArray(e.parts)||e.parts.length<1||e.parts.length>5)throw Error('manifest');if(e.rev!==lastCipher){const pieces=[];for(const path of e.parts){if(!/^payload-[a-f0-9]{12}-[0-4]\.txt$/.test(path)||!path.startsWith('payload-'+e.rev+'-'))throw Error('path');const part=await fetch(new URL(path,location.href),{cache:'force-cache',credentials:'omit',redirect:'error',signal:ctl.signal});if(!part.ok)throw Error('part');const chunk=await part.text();if(chunk.length>400000)throw Error('size');pieces.push(chunk)}e.data=pieces.join('');const html=await decode(e);frame.srcdoc=html;lastCipher=e.rev}frame.style.display='block';$('gate').hidden=true;$('reload').hidden=false;$('lock').hidden=false;$('state').textContent='已解鎖 · 每60秒檢查新發佈 · 工作時間以台帳為準';failures=0;$('error').textContent=''}catch{failures++;$('state').textContent='更新未成功 · 不將失聯當正常；保留已讀資料';$('error').textContent='無法解鎖或取得資料。請確認私人金鑰及網路；尚未讀取任何新的營運狀態。'}finally{clearTimeout(deadline);busy=false}}
async function unlock(value){try{const d=value.trim();if(b64(d,44).length!==32)throw Error('key');const {kid,...pub}=RECIPIENT;priv=await crypto.subtle.importKey('jwk',{...pub,d},{name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);await refresh();if(lastCipher){try{sessionStorage.setItem(store,d)}catch{}$('key').value='';history.replaceState(null,'',location.pathname)}}catch{$('error').textContent='金鑰不正確；未讀取營運資料。';priv=null}}
$('unlock').onclick=()=>unlock($('key').value);$('key').onkeydown=e=>{if(e.key==='Enter')unlock($('key').value)};$('reload').onclick=refresh;$('lock').onclick=()=>{priv=null;lastCipher='';try{sessionStorage.removeItem(store)}catch{}frame.srcdoc='';frame.style.display='none';$('gate').hidden=false;$('reload').hidden=true;$('lock').hidden=true;$('state').textContent='已鎖定';};
addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.type==='boycelab-refresh')refresh();if(e.data?.type==='boycelab-view'&&['overview','team','pipeline','plan','actions','system'].includes(e.data.view))view=e.data.view;if(e.data?.type==='boycelab-ready')frame.contentWindow.postMessage({type:'boycelab-open-view',view},'*')});
setInterval(()=>{if(!document.hidden&&failures<2)refresh()},60000);let initial=new URLSearchParams(location.hash.slice(1)).get('access');if(!initial)try{initial=sessionStorage.getItem(store)}catch{}if(initial)unlock(initial);
</script></body></html>
