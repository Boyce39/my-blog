name: Verify encrypted monitor publication
on:
  push:
    paths:
      - 'ops-monitor/**'
      - '.github/workflows/monitor-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-readonly-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public HTTPS files without any owner key
        env:
          BASE_URL: https://boyce39.github.io/my-blog/ops-monitor/
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, time, os, hashlib
          base=os.environ['BASE_URL']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'BoyceLab-Public-Monitor-Check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=10) as r:
                  if r.status != 200 or not r.url.startswith(base):
                      raise RuntimeError('Unexpected HTTP response')
                  value=r.read(1200001)
                  if len(value)>1200000: raise RuntimeError('Response too large')
                  return value.decode('utf-8')
          for attempt in range(3):
              try:
                  shell=get('index.html')
                  assert 'BoyceLab' in shell and 'crypto.subtle' in shell and 'payload.json' in shell
                  assert 'eve@eve.com.tw' not in shell
                  m=json.loads(get('payload.json'))
                  assert m['v']==1 and m['alg']=='ECDH-P256-HKDF-SHA256-A256GCM'
                  assert m['kid']=='69d0147562809bf7' and 'd' not in m['epk']
                  assert re.fullmatch('[a-f0-9]{12}',m['rev']) and 1<=len(m['parts'])<=5
                  pieces=[]
                  for path in m['parts']:
                      assert re.fullmatch('payload-'+m['rev']+'-[0-4]\\.txt',path)
                      part=get(path)
                      assert re.fullmatch('[A-Za-z0-9_-]+',part)
                      pieces.append(part)
                  cipher=''.join(pieces)
                  assert len(cipher)>100
                  print(json.dumps({'status':'PUBLIC_HTTPS_VERIFIED','url':base,'http':200,'encrypted_parts':len(pieces),'revision':m['rev'],'cipher_sha256':hashlib.sha256(cipher.encode()).hexdigest(),'private_key_used':False,'owner_browser_unlock_tested':False}))
                  break
              except Exception as exc:
                  print('Verification attempt',attempt+1,'failed:',type(exc).__name__)
                  if attempt==2: raise
                  time.sleep(20)
          PY
