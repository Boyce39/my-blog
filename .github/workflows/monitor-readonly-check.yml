name: Verify encrypted monitor publication
on:
  push:
    paths:
      - 'ops-monitor/**'
      - '.github/workflows/monitor-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitor-readonly-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify both encrypted layers over public HTTPS without owner key
        env:
          BASE_URL: https://boyce39.github.io/my-blog/ops-monitor/
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, time, os, hashlib
          base=os.environ['BASE_URL']
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          expected_base='https://raw.githubusercontent.com/Boyce39/my-blog/'+sha+'/ops-monitor/'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'BoyceLab-Public-Monitor-Check/2.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=10) as r:
                  if r.status!=200: raise RuntimeError('HTTP failure')
                  value=r.read(1200001)
                  if len(value)>1200000: raise RuntimeError('Response too large')
                  return value
          paths=['index.html','receipts-overlay.js','payload.json','receipts.json']
          expected={path:get(expected_base+path) for path in paths}
          for attempt in range(3):
              try:
                  for path in paths:
                      assert get(base+path)==expected[path], 'Deployment not at expected commit: '+path
                  shell=expected['index.html'].decode()
                  assert 'receipts-overlay.js' in shell and 'receipts.json' in shell
                  assert 'eve@eve.com.tw' not in shell
                  results={}
                  for path in ['payload.json','receipts.json']:
                      m=json.loads(expected[path])
                      assert m['v']==1 and m['alg']=='ECDH-P256-HKDF-SHA256-A256GCM'
                      assert m['kid']=='69d0147562809bf7' and 'd' not in m['epk']
                      assert re.fullmatch('[a-f0-9]{12}',m['rev']) and 1<=len(m['parts'])<=5
                      pieces=[]
                      for part in m['parts']:
                          assert re.fullmatch('payload-'+m['rev']+r'-[0-4]\.txt',part)
                          data=get(base+part)
                          assert re.fullmatch(rb'[A-Za-z0-9_-]+',data)
                          pieces.append(data)
                      cipher=b''.join(pieces)
                      assert hashlib.sha256(cipher).hexdigest().startswith(m['rev'])
                      results[path]={'revision':m['rev'],'parts':len(pieces)}
                  print(json.dumps({'status':'PUBLIC_HTTPS_BOTH_LAYERS_VERIFIED','url':base,'commit':sha,'layers':results,'http':200,'private_key_used':False,'owner_browser_unlock_tested':False}))
                  break
              except Exception as exc:
                  print('Verification attempt',attempt+1,'failed:',type(exc).__name__)
                  if attempt==2: raise
                  time.sleep(20)
          PY
